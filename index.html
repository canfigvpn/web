<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090d">
<meta name="description" content="مدیریت اشتراک‌های VPN، مشاهده مصرف، زمان باقی‌مانده، کپی کانفیگ و QR Code">
<title>Floki VPN | اشتراک‌ها</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
:root{
  --bg:#07080c;
  --bg2:#0d1017;
  --card:rgba(18,21,29,.88);
  --card2:#11151d;
  --line:rgba(255,255,255,.08);
  --text:#f4f6fb;
  --muted:#9299a8;
  --gold:#d7ad45;
  --gold2:#f0d27c;
  --green:#42d392;
  --red:#ff6474;
  --blue:#69a7ff;
  --shadow:0 18px 55px rgba(0,0,0,.38);
  --radius:22px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:Vazirmatn,Arial,sans-serif;
  background:
    radial-gradient(circle at 10% 0%,rgba(215,173,69,.12),transparent 30%),
    radial-gradient(circle at 90% 15%,rgba(70,120,255,.10),transparent 28%),
    linear-gradient(145deg,var(--bg),var(--bg2));
}
button,input{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.container{width:min(1120px,calc(100% - 28px));margin:auto}
header{
  position:sticky;top:0;z-index:50;
  backdrop-filter:blur(18px);
  background:rgba(7,8,12,.76);
  border-bottom:1px solid var(--line);
}
.nav{
  min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:15px
}
.brand{display:flex;align-items:center;gap:11px;font-weight:800}
.brand-icon{
  width:42px;height:42px;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--gold2),var(--gold));
  color:#111;box-shadow:0 8px 28px rgba(215,173,69,.18)
}
.brand small{display:block;color:var(--muted);font-weight:500;font-size:11px;margin-top:1px}
.nav-actions{display:flex;gap:8px}
.icon-btn{
  width:42px;height:42px;border:1px solid var(--line);border-radius:13px;
  color:var(--text);background:rgba(255,255,255,.035)
}
main{padding:30px 0 70px}
.hero{
  padding:30px;border:1px solid rgba(215,173,69,.18);border-radius:28px;
  background:linear-gradient(145deg,rgba(215,173,69,.08),rgba(255,255,255,.025));
  box-shadow:var(--shadow);margin-bottom:22px
}
.hero h1{font-size:clamp(25px,5vw,40px);margin:0 0 10px}
.hero p{margin:0;color:var(--muted);line-height:1.9}
.toolbar{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.search{
  flex:1;min-width:220px;padding:13px 16px;border:1px solid var(--line);
  background:#0a0d12;color:var(--text);border-radius:14px;outline:none
}
.search:focus{border-color:rgba(215,173,69,.5)}
.btn{
  border:0;border-radius:14px;padding:12px 17px;font-weight:700;
  background:linear-gradient(135deg,var(--gold2),var(--gold));color:#111
}
.btn.secondary{background:#171b24;color:var(--text);border:1px solid var(--line)}
.status{
  margin:18px 0;color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px
}
.spinner{
  width:15px;height:15px;border:2px solid #303642;border-top-color:var(--gold);
  border-radius:50%;animation:spin .8s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:15px
}
.file-card{
  position:relative;overflow:hidden;padding:21px;border:1px solid var(--line);
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  transition:.2s transform,.2s border-color
}
.file-card:hover{transform:translateY(-3px);border-color:rgba(215,173,69,.35)}
.file-icon{
  width:46px;height:46px;border-radius:15px;display:grid;place-items:center;
  background:rgba(215,173,69,.1);color:var(--gold2);font-size:19px;margin-bottom:16px
}
.file-name{font-weight:800;font-size:17px;word-break:break-word}
.file-path{font-size:11px;color:var(--muted);direction:ltr;text-align:right;margin-top:5px;word-break:break-all}
.card-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:19px}
.badge{font-size:11px;padding:6px 9px;border-radius:9px;background:#171b24;color:var(--muted)}
.open-btn{padding:9px 13px;border-radius:11px;background:var(--gold);color:#111;font-weight:800;border:0}
.empty{
  text-align:center;padding:45px 20px;border:1px dashed var(--line);
  border-radius:22px;color:var(--muted);grid-column:1/-1
}
.page{display:none}
.page.active{display:block}
.back{
  display:inline-flex;align-items:center;gap:8px;color:var(--muted);
  border:0;background:none;padding:0;margin-bottom:16px
}
.account-head{
  display:flex;justify-content:space-between;align-items:center;gap:15px;
  margin-bottom:18px;flex-wrap:wrap
}
.account-title{font-size:25px;font-weight:800;word-break:break-word}
.account-path{font-size:12px;color:var(--muted);direction:ltr}
.panel{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;margin-bottom:15px;box-shadow:var(--shadow)
}
.stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:11px
}
.stat{
  background:#0d1118;border:1px solid var(--line);border-radius:17px;padding:17px;min-width:0
}
.stat i{color:var(--gold);margin-bottom:9px}
.stat-label{font-size:11px;color:var(--muted)}
.stat-value{font-size:18px;font-weight:800;margin-top:4px;word-break:break-word}
.progress{
  height:9px;background:#202530;border-radius:99px;overflow:hidden;margin-top:14px
}
.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:inherit;transition:width .5s}
.info-row{
  display:flex;justify-content:space-between;gap:15px;padding:12px 0;
  border-bottom:1px solid var(--line);font-size:13px
}
.info-row:last-child{border-bottom:0}
.info-row span:first-child{color:var(--muted)}
.ltr{direction:ltr;text-align:left;word-break:break-all}
.config{
  border:1px solid var(--line);border-radius:17px;background:#090c11;
  margin-bottom:11px;overflow:hidden
}
.config-head{
  padding:13px 15px;display:flex;justify-content:space-between;align-items:center;
  gap:10px;background:#0e1219
}
.config-name{font-weight:700;font-size:13px;word-break:break-word}
.config-actions{display:flex;gap:6px;flex-shrink:0}
.small-btn{
  border:1px solid var(--line);background:#181d26;color:var(--text);
  border-radius:9px;padding:7px 9px;font-size:11px
}
.small-btn:hover{border-color:rgba(215,173,69,.45)}
.config-body{
  padding:13px;font:11px/1.8 Consolas,monospace;color:#b9c2d2;
  white-space:pre-wrap;word-break:break-all;direction:ltr;text-align:left;max-height:150px;overflow:auto
}
.qr-wrap{text-align:center}
.qr{
  display:inline-block;padding:13px;background:#fff;border-radius:15px;min-height:26px
}
.qr canvas,.qr img{display:block}
.qr-title{font-weight:700;margin-bottom:14px}
.notice{
  padding:13px 15px;border-radius:14px;background:rgba(105,167,255,.08);
  border:1px solid rgba(105,167,255,.17);color:#b9d2ff;font-size:12px;line-height:1.9
}
.notice.warn{
  background:rgba(255,100,116,.07);border-color:rgba(255,100,116,.16);color:#ffc0c7
}
.toast{
  position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);
  opacity:0;pointer-events:none;z-index:100;padding:12px 17px;border-radius:13px;
  background:#171b23;border:1px solid var(--line);box-shadow:var(--shadow);
  transition:.25s;font-size:12px
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.footer{text-align:center;color:#646b79;font-size:11px;padding:30px 0}
@media(max-width:700px){
  .container{width:min(100% - 20px,1120px)}
  main{padding-top:18px}
  .hero{padding:22px}
  .stats{grid-template-columns:1fr}
  .panel{padding:15px}
  .config-head{align-items:flex-start}
}
</style>
</head>

<body>
<header>
  <div class="container nav">
    <a class="brand" href="#" onclick="goHome();return false">
      <span class="brand-icon"><i class="fa-solid fa-bolt"></i></span>
      <span>FLOKI VPN<small>Subscription Manager</small></span>
    </a>
    <div class="nav-actions">
      <button class="icon-btn" title="بازخوانی" onclick="loadRepository()"><i class="fa-solid fa-rotate"></i></button>
      <button class="icon-btn" title="خانه" onclick="goHome()"><i class="fa-solid fa-house"></i></button>
    </div>
  </div>
</header>

<main>
<div class="container">

  <section id="homePage" class="page active">
    <div class="hero">
      <h1>اشتراک‌های VPN</h1>
      <p>فایل‌های <b>.sub</b> ریپو به‌صورت خودکار پیدا می‌شوند. هر فایل صفحه اختصاصی خودش را دارد؛ کانفیگ، کپی، QR، مصرف و زمان انقضا از لینک اشتراک نمایش داده می‌شود.</p>
      <div class="toolbar">
        <input id="search" class="search" type="search" placeholder="جستجوی نام فایل..." oninput="renderFiles()">
        <button class="btn" onclick="loadRepository()"><i class="fa-solid fa-rotate"></i> بروزرسانی</button>
      </div>
    </div>
    <div id="repoStatus" class="status"><span class="spinner"></span> در حال خواندن GitHub...</div>
    <div id="fileGrid" class="grid"></div>
  </section>

  <section id="accountPage" class="page">
    <button class="back" onclick="goHome()"><i class="fa-solid fa-arrow-right"></i> برگشت به اشتراک‌ها</button>
    <div id="accountContent"></div>
  </section>

  <div class="footer">FLOKI VPN • اطلاعات مصرف از Subscription URL خوانده می‌شود</div>
</div>
</main>

<div id="toast" class="toast"></div>

<script>
'use strict';

/* =========================
   تنظیمات اصلی
========================= */
const CONFIG = {
  owner: 'canfigvpn',
  repo: 'web',
  branch: 'main',

  // اگر .sub ها داخل یک پوشه خاص هستند، اینجا بنویس.
  // خالی = کل ریپو
  subDirectory: '',

  // لینک نمونه/پیش‌فرض اشتراک
  defaultSubscription: 'https://g.floki000.kdns.fr/sub?sub=user1&key=3847782f5bda'
};

const state = {
  files: [],
  current: null
};

const $ = id => document.getElementById(id);

function rawUrl(path){
  return 'https://raw.githubusercontent.com/' +
    CONFIG.owner + '/' + CONFIG.repo + '/' + CONFIG.branch + '/' +
    path.split('/').map(encodeURIComponent).join('/');
}

function githubTreeUrl(){
  return 'https://api.github.com/repos/' + CONFIG.owner + '/' +
    CONFIG.repo + '/git/trees/' + CONFIG.branch + '?recursive=1';
}

function cleanName(path){
  const base = path.split('/').pop();
  return base.replace(/\.sub$/i,'') || base;
}

function escapeHtml(value){
  return String(value ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function setStatus(text, loading=false){
  $('repoStatus').innerHTML = (loading ? '<span class="spinner"></span> ' : '') + escapeHtml(text);
}

async function loadRepository(){
  setStatus('در حال خواندن لیست فایل‌های GitHub...', true);

  try{
    const res = await fetch(githubTreeUrl(), {
      cache:'no-store',
      headers:{'Accept':'application/vnd.github+json'}
    });

    if(!res.ok) throw new Error('GitHub HTTP ' + res.status);

    const data = await res.json();
    let tree = Array.isArray(data.tree) ? data.tree : [];

    state.files = tree
      .filter(item =>
        item.type === 'blob' &&
        /\.sub$/i.test(item.path) &&
        (!CONFIG.subDirectory || item.path.startsWith(CONFIG.subDirectory.replace(/^\/+|\/+$/g,'') + '/'))
      )
      .map(item => ({
        path:item.path,
        name:cleanName(item.path),
        url:rawUrl(item.path)
      }))
      .sort((a,b)=>a.name.localeCompare(b.name,'fa'));

    if(data.truncated){
      setStatus('لیست GitHub بزرگ است و پاسخ API ناقص شده است.');
    }else{
      setStatus(state.files.length + ' فایل .sub پیدا شد.');
    }

    renderFiles();
  }catch(error){
    console.error(error);
    state.files = [];
    setStatus('خطا در خواندن ریپو: ' + error.message);
    $('fileGrid').innerHTML =
      '<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i><br><br>' +
      'امکان خواندن فایل‌های GitHub وجود ندارد.<br>صفحه را دوباره بازخوانی کنید.</div>';
  }
}

function renderFiles(){
  const query = $('search').value.trim().toLowerCase();
  const files = state.files.filter(f =>
    !query || f.name.toLowerCase().includes(query) || f.path.toLowerCase().includes(query)
  );

  if(!files.length){
    $('fileGrid').innerHTML =
      '<div class="empty"><i class="fa-regular fa-folder-open"></i><br><br>' +
      (state.files.length ? 'فایلی با این نام پیدا نشد.' : 'هنوز فایل .sub در ریپو وجود ندارد.') +
      '</div>';
    return;
  }

  $('fileGrid').innerHTML = files.map((f,i)=>`
    <article class="file-card">
      <div class="file-icon"><i class="fa-solid fa-file-shield"></i></div>
      <div class="file-name">${escapeHtml(f.name)}</div>
      <div class="file-path">${escapeHtml(f.path)}</div>
      <div class="card-footer">
        <span class="badge">.sub</span>
        <button class="open-btn" onclick="openAccount(${i}, '${encodeURIComponent(f.path)}')">
          مشاهده <i class="fa-solid fa-arrow-left"></i>
        </button>
      </div>
    </article>
  `).join('');
}

async function openAccount(index, encodedPath){
  const path = decodeURIComponent(encodedPath);
  const file = state.files.find(x=>x.path===path);
  if(!file) return;

  state.current = file;
  location.hash = 'sub=' + encodeURIComponent(file.path);

  $('homePage').classList.remove('active');
  $('accountPage').classList.add('active');
  $('accountContent').innerHTML =
    '<div class="panel"><div class="status"><span class="spinner"></span> در حال خواندن فایل اشتراک...</div></div>';

  try{
    const fileText = await fetchText(file.url);
    const urls = extractSubscriptionUrls(fileText);

    // اگر خود فایل فقط یک لینک/لینک‌های اشتراک داشته باشد، همان‌ها استفاده می‌شوند.
    // اگر لینک پیدا نشود، لینک پیش‌فرض فقط به‌عنوان fallback استفاده می‌شود.
    const subscriptions = urls.length ? urls : [CONFIG.defaultSubscription];

    let configs = parseConfigs(fileText);
    const name = file.name;

    // اگر فایل .sub فقط لینک اشتراک دارد، محتوای subscription را هم می‌خوانیم.
    if(!configs.length && subscriptions.length){
      try{
        const subResponse = await fetch(subscriptions[0], {cache:'no-store'});
        if(subResponse.ok){
          const subText = await subResponse.text();
          configs = parseConfigs(decodeSubscriptionBody(subText));
        }
      }catch(error){
        console.warn('Subscription config fetch failed:', error);
      }
    }

    $('accountContent').innerHTML = `
      <div class="account-head">
        <div>
          <div class="account-title">${escapeHtml(name)}</div>
          <div class="account-path">${escapeHtml(file.path)}</div>
        </div>
        <button class="btn secondary" onclick="copyText(${JSON.stringify(fileText)})">
          <i class="fa-regular fa-copy"></i> کپی فایل
        </button>
      </div>

      <div id="usagePanel" class="panel">
        <div class="status"><span class="spinner"></span> در حال دریافت مصرف و زمان اشتراک...</div>
      </div>

      <div class="panel">
        <div class="info-row">
          <span>لینک اشتراک</span>
          <span class="ltr">${escapeHtml(subscriptions[0])}</span>
        </div>
        <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn" onclick="copyText(${JSON.stringify(subscriptions[0])})">
            <i class="fa-regular fa-copy"></i> کپی لینک اشتراک
          </button>
          <button class="btn secondary" onclick="downloadGeneratedFile()">
            <i class="fa-solid fa-download"></i> فایل خودکار
          </button>
        </div>
      </div>

      <div class="panel">
        <div style="font-weight:800;margin-bottom:15px">
          <i class="fa-solid fa-server" style="color:var(--gold)"></i>
          کانفیگ‌ها (${configs.length})
        </div>
        <div id="configs">${configs.length ? configs.map((c,i)=>configHtml(c,i)).join('') :
          '<div class="notice warn">کانفیگ قابل تشخیصی داخل فایل پیدا نشد.</div>'}</div>
      </div>

      <div class="panel">
        <div class="qr-wrap">
          <div class="qr-title"><i class="fa-solid fa-qrcode" style="color:var(--gold)"></i> QR لینک اشتراک</div>
          <div id="mainQr" class="qr"></div>
        </div>
      </div>
    `;

    new QRCode($('mainQr'),{
      text:subscriptions[0],
      width:210,
      height:210,
      colorDark:'#111111',
      colorLight:'#ffffff',
      correctLevel:QRCode.CorrectLevel.M
    });

    state.current.fileText = fileText;
    state.current.subscriptionUrl = subscriptions[0];
    state.current.configs = configs;
    state.current.usage = null;

    await loadUsage(subscriptions[0]);
  }catch(error){
    console.error(error);
    $('accountContent').innerHTML =
      '<div class="panel"><div class="notice warn">' +
      'خواندن فایل با خطا مواجه شد: ' + escapeHtml(error.message) +
      '</div></div>';
  }
}

async function fetchText(url){
  const res = await fetch(url,{cache:'no-store'});
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return await res.text();
}

function extractSubscriptionUrls(text){
  const matches = text.match(/https?:\/\/[^\s"'<>]+/g) || [];
  return [...new Set(matches.map(x=>x.replace(/[),;]+$/g,'')))]
    .filter(x=>/\/sub(?:\?|\/|$)/i.test(x) || /subscription|subscribe/i.test(x));
}

function decodeSubscriptionBody(text){
  const clean = String(text || '').trim();

  try{
    const normalized = clean.replace(/\s+/g,'');
    if(normalized.length > 20 && /^[A-Za-z0-9+/=_-]+$/.test(normalized)){
      const padded = normalized.replace(/-/g,'+').replace(/_/g,'/');
      const binary = atob(padded + '='.repeat((4 - padded.length % 4) % 4));
      const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
      const decoded = new TextDecoder('utf-8').decode(bytes);
      if(/(?:vless|vmess|trojan|ss|ssr|hysteria|tuic):\/\//i.test(decoded)){
        return decoded;
      }
    }
  }catch{}

  return clean;
}

function parseConfigs(text){
  const decodedText = decodeSubscriptionBody(text);
  const lines = decodedText.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  const result=[];

  for(const line of lines){
    if(/^(vless|vmess|trojan|ss|ssr|hysteria2?|tuic):\/\//i.test(line)){
      result.push({
        protocol:(line.match(/^([a-z0-9]+):\/\//i)||['','config'])[1].toUpperCase(),
        value:line,
        name:decodeConfigName(line)
      });
    }
  }

  return result;
}

function decodeConfigName(url){
  try{
    const hash = url.split('#')[1];
    return hash ? decodeURIComponent(hash) : 'کانفیگ';
  }catch{
    return 'کانفیگ';
  }
}

function configHtml(c,i){
  const safe = JSON.stringify(c.value);
  return `
    <article class="config">
      <div class="config-head">
        <div class="config-name">
          <span class="badge">${escapeHtml(c.protocol)}</span>
          &nbsp; ${escapeHtml(c.name)}
        </div>
        <div class="config-actions">
          <button class="small-btn" onclick="copyText(${safe})"><i class="fa-regular fa-copy"></i> کپی</button>
          <button class="small-btn" onclick="showQr(${i})"><i class="fa-solid fa-qrcode"></i> QR</button>
        </div>
      </div>
      <div class="config-body">${escapeHtml(c.value)}</div>
      <div id="qr-${i}" style="display:none;text-align:center;padding:15px;background:#fff"></div>
    </article>
  `;
}

function showQr(i){
  const c = state.current.configs[i];
  const box = $('qr-'+i);
  if(!box) return;

  if(box.style.display === 'block'){
    box.style.display='none';
    box.innerHTML='';
    return;
  }

  box.style.display='block';
  box.innerHTML='';
  new QRCode(box,{
    text:c.value,
    width:190,
    height:190,
    colorDark:'#111',
    colorLight:'#fff',
    correctLevel:QRCode.CorrectLevel.M
  });
}

async function loadUsage(subscriptionUrl){
  const panel = $('usagePanel');

  try{
    const res = await fetch(subscriptionUrl,{cache:'no-store'});

    const header =
      res.headers.get('subscription-userinfo') ||
      res.headers.get('Subscription-Userinfo') ||
      res.headers.get('subscription-user-info');

    const contentType = res.headers.get('content-type') || '';
    const text = await res.text();

    let info = parseUserInfo(header);

    // بعض سرویس‌ها اطلاعات را در متن JSON برمی‌گردانند.
    if(!info) info = parseUserInfoFromText(text);

    if(!info){
      panel.innerHTML = `
        <div class="notice warn">
          لینک اشتراک پاسخ داد، اما اطلاعات مصرف/انقضا در هدر
          <b>subscription-userinfo</b> یا بدنه پاسخ قابل خواندن نبود.
          اگر سرور هدر را با CORS expose نکند، مرورگر اجازه خواندن آن را نمی‌دهد.
        </div>
      `;
      return;
    }

    const upload = Number(info.upload||0);
    const download = Number(info.download||0);
    const total = Number(info.total||0);
    const used = upload + download;
    const expire = Number(info.expire||0);

    state.current.usage = {
      upload, download, total, used, expire,
      remaining: total ? Math.max(0,total-used) : null,
      remainingText: formatRemaining(expire)
    };
    const percent = total > 0 ? Math.min(100,(used/total)*100) : 0;

    panel.innerHTML = `
      <div style="font-weight:800;margin-bottom:15px">
        <i class="fa-solid fa-chart-simple" style="color:var(--gold)"></i>
        وضعیت اشتراک
      </div>

      <div class="stats">
        <div class="stat">
          <i class="fa-solid fa-arrow-up"></i>
          <div class="stat-label">آپلود</div>
          <div class="stat-value">${formatBytes(upload)}</div>
        </div>
        <div class="stat">
          <i class="fa-solid fa-arrow-down"></i>
          <div class="stat-label">دانلود</div>
          <div class="stat-value">${formatBytes(download)}</div>
        </div>
        <div class="stat">
          <i class="fa-solid fa-chart-pie"></i>
          <div class="stat-label">مصرف</div>
          <div class="stat-value">${formatBytes(used)} / ${total ? formatBytes(total) : 'نامحدود'}</div>
        </div>
      </div>

      ${total ? `
      <div class="progress"><span style="width:${percent}%"></span></div>
      <div style="display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:7px">
        <span>${percent.toFixed(1)}٪ مصرف شده</span>
        <span>${formatBytes(Math.max(0,total-used))} باقی‌مانده</span>
      </div>` : ''}

      <div style="margin-top:15px">
        <div class="info-row">
          <span>کل مصرف</span><b>${formatBytes(used)}</b>
        </div>
        <div class="info-row">
          <span>حجم باقی‌مانده</span><b>${total ? formatBytes(Math.max(0,total-used)) : 'نامحدود'}</b>
        </div>
        <div class="info-row">
          <span>زمان باقی‌مانده</span><b>${formatRemaining(expire)}</b>
        </div>
        <div class="info-row">
          <span>تاریخ انقضا</span><b>${expire ? formatDate(expire) : 'نامحدود'}</b>
        </div>
      </div>
    `;
  }catch(error){
    console.error(error);
    panel.innerHTML = `
      <div class="notice warn">
        دریافت اطلاعات مصرف انجام نشد.
        <br>علت احتمالی: CORS یا در دسترس نبودن لینک اشتراک.
      </div>
    `;
  }
}

function parseUserInfo(value){
  if(!value) return null;

  const obj={};
  for(const part of String(value).split(/[;,]/)){
    const m=part.trim().match(/^(upload|download|total|expire)\s*=\s*(\d+)/i);
    if(m) obj[m[1].toLowerCase()]=Number(m[2]);
  }

  return Object.keys(obj).length ? obj : null;
}

function parseUserInfoFromText(text){
  const patterns = [
    /(?:subscription-userinfo|subscription_userinfo)[^\n\r]*?upload\s*[=:]\s*(\d+)[^\n\r]*?download\s*[=:]\s*(\d+)[^\n\r]*?total\s*[=:]\s*(\d+)[^\n\r]*?expire\s*[=:]\s*(\d+)/i
  ];

  for(const p of patterns){
    const m=text.match(p);
    if(m) return {upload:+m[1],download:+m[2],total:+m[3],expire:+m[4]};
  }

  try{
    const json=JSON.parse(text);
    if(json && typeof json==='object'){
      const x=json.subscriptionUserinfo || json.subscription_userinfo || json;
      if(x.upload!==undefined || x.download!==undefined || x.total!==undefined || x.expire!==undefined){
        return {
          upload:Number(x.upload||0),
          download:Number(x.download||0),
          total:Number(x.total||0),
          expire:Number(x.expire||0)
        };
      }
    }
  }catch{}

  return null;
}

function formatBytes(bytes){
  bytes=Number(bytes)||0;
  if(bytes<1024) return bytes+' B';
  const units=['KB','MB','GB','TB','PB'];
  let n=bytes/1024,i=0;
  while(n>=1024 && i<units.length-1){n/=1024;i++}
  return n.toFixed(n>=100?0:n>=10?1:2)+' '+units[i];
}

function formatDate(unix){
  const d=new Date(Number(unix)*1000);
  if(Number.isNaN(d.getTime())) return 'نامشخص';
  return new Intl.DateTimeFormat('fa-IR',{
    year:'numeric',month:'2-digit',day:'2-digit',
    hour:'2-digit',minute:'2-digit'
  }).format(d);
}

function formatRemaining(unix){
  if(!unix) return 'نامحدود';
  const diff=Number(unix)*1000-Date.now();
  if(diff<=0) return 'منقضی شده';

  let sec=Math.floor(diff/1000);
  const days=Math.floor(sec/86400); sec%=86400;
  const hours=Math.floor(sec/3600); sec%=3600;
  const mins=Math.floor(sec/60);

  if(days>0) return days+' روز و '+hours+' ساعت';
  if(hours>0) return hours+' ساعت و '+mins+' دقیقه';
  return mins+' دقیقه';
}

async function copyText(text){
  try{
    await navigator.clipboard.writeText(String(text));
    toast('کپی شد ✓');
  }catch{
    const ta=document.createElement('textarea');
    ta.value=text;document.body.appendChild(ta);ta.select();
    document.execCommand('copy');ta.remove();
    toast('کپی شد ✓');
  }
}

function toast(text){
  const t=$('toast');
  t.textContent=text;t.classList.add('show');
  clearTimeout(window.__toast);
  window.__toast=setTimeout(()=>t.classList.remove('show'),1800);
}

function downloadGeneratedFile(){
  if(!state.current) return;

  const u = state.current.usage;
  const info =
    'FLOKI VPN - SUBSCRIPTION INFO\n' +
    '================================\n' +
    'Name: ' + state.current.name + '\n' +
    'Subscription: ' + state.current.subscriptionUrl + '\n' +
    'Generated: ' + new Date().toISOString() + '\n' +
    '--------------------------------\n' +
    'Used: ' + (u ? formatBytes(u.used) : 'Unknown') + '\n' +
    'Remaining: ' + (u && u.remaining !== null ? formatBytes(u.remaining) : 'Unlimited/Unknown') + '\n' +
    'Time remaining: ' + (u ? u.remainingText : 'Unknown') + '\n' +
    'Expire: ' + (u && u.expire ? formatDate(u.expire) : 'Unlimited/Unknown') + '\n' +
    '================================\n\n' +
    state.current.fileText;

  const blob=new Blob([info],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=state.current.name+'.txt';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('فایل خودکار ساخته شد ✓');
}

function goHome(){
  location.hash='';
  $('accountPage').classList.remove('active');
  $('homePage').classList.add('active');
}

async function route(){
  const hashMatch=location.hash.match(/^#sub=(.+)$/);
  const queryPath=new URLSearchParams(location.search).get('sub');
  const encodedPath=hashMatch ? hashMatch[1] : queryPath;

  if(!encodedPath){goHome();return}

  const path=decodeURIComponent(encodedPath);
  const file=state.files.find(x=>x.path===path);

  if(file){
    await openAccount(0,encodeURIComponent(path));
  }else{
    goHome();
  }
}

window.addEventListener('hashchange',route);
window.addEventListener('load',async()=>{
  await loadRepository();
  await route();
});
